    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background:
                radial-gradient(circle at 50% 35%, rgba(212,175,55,0.12), transparent 35%),
                linear-gradient(180deg, #050505 0%, #000000 100%);
            color: #ffffff;
            font-family: 'Tajawal', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }

        .page {
            width: 100%;
            max-width: 520px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 25px 20px 100px;
            position: relative;
        }

        .brand {
            text-align: center;
            margin-bottom: 35px;
        }

        .brand h1 {
            font-size: 30px;
            font-weight: 800;
            letter-spacing: 1px;
            color: #d4af37;
            text-shadow: 0 0 18px rgba(212,175,55,0.25);
        }

        .brand p {
            margin-top: 8px;
            color: #bdbdbd;
            font-size: 15px;
            font-weight: 500;
        }

        .hero {
            text-align: center;
            margin-bottom: 30px;
        }

        .hero-badge {
            display: inline-block;
            padding: 7px 18px;
            border: 1px solid rgba(212,175,55,0.35);
            border-radius: 30px;
            color: #d4af37;
            font-size: 13px;
            margin-bottom: 15px;
            background: rgba(212,175,55,0.05);
        }

        .hero h2 {
            font-size: 25px;
            line-height: 1.5;
            font-weight: 800;
        }

        .hero p {
            margin-top: 10px;
            color: #aaa;
            font-size: 15px;
            line-height: 1.7;
        }

        .cta-area {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: -5px 0 55px;
        }

        .whatsapp-circle {
            width: 145px;
            height: 145px;
            border-radius: 50%;
            border: 4px solid rgba(37,211,102,0.45);
            background: #25D366;
            display: flex;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            box-shadow:
                0 15px 35px rgba(0,0,0,0.55),
                0 0 35px rgba(37,211,102,0.25),
                inset 0 2px 5px rgba(255,255,255,0.25);
            transition: background 0.12s ease, transform 0.18s ease, box-shadow 0.18s ease;
        }

        .whatsapp-circle:active {
            background: #128C7E;
            transform: scale(0.94);
            box-shadow:
                0 7px 18px rgba(0,0,0,0.5),
                inset 0 3px 7px rgba(0,0,0,0.2);
        }

        .whatsapp-icon {
            width: 68px;
            height: 68px;
        }

        .bottom-button {
            position: fixed;
            bottom: 18px;
            left: 50%;
            transform: translateX(-50%);

            width: calc(100% - 40px);
            max-width: 370px;
            min-height: 62px;
            border-radius: 18px;
            background: #25D366;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            font-size: 18px;
            font-weight: 800;
            box-shadow:
                0 12px 28px rgba(0,0,0,0.55),
                0 0 25px rgba(37,211,102,0.20),
                inset 0 2px 4px rgba(255,255,255,0.2);
            transition: background 0.12s ease, transform 0.18s ease, box-shadow 0.18s ease;
            z-index: 1000;
        }

        .bottom-button:active {
            background: #128C7E;
            transform: translateX(-50%) translateY(3px) scale(0.98);
            box-shadow:
                0 5px 12px rgba(0,0,0,0.5),
                inset 0 3px 7px rgba(0,0,0,0.2);
        }

        .bottom-icon {
            width: 30px;
            height: 30px;
        }

        .note {
            margin-top: 20px;
            color: #777;
            font-size: 12px;
            text-align: center;
        }

        @media (max-width: 480px) {
            .page {
                padding-top: 20px;
                padding-bottom: 105px;
            }

            .brand h1 {
                font-size: 27px;
            }

            .hero h2 {
                font-size: 22px;
            }

            .whatsapp-circle {
                width: 135px;
                height: 135px;
            }

            .whatsapp-icon {
                width: 63px;
                height: 63px;
            }

            .bottom-button {
                min-height: 58px;
                font-size: 17px;
                bottom: 14px;
            }
        }
    </style>
</head>

<body>
